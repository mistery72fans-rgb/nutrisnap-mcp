name: 24/7 NutriSnap Cloud Keep-Alive

on:
  schedule:
    # Run every 10 minutes to keep the Render cloud server awake 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping NutriSnap Cloud Health Endpoint
        run: |
          curl -s -f https://nutrisnap-mcp.onrender.com/api/health || echo "Server is waking up"
